name: tech-graph

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  manifest_check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Tech Graph manifest check
        run: python tools/tech_graph_manifest_check.py
