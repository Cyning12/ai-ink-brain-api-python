name: tech-graph

on:
  pull_request:
  push:
    branches:
      - main
      # 当前集成开发分支；合并入 main 后可删
      - agent-v3

jobs:
  manifest_check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Tech Graph manifest check
        run: python tools/tech_graph_manifest_check.py

      - name: Tech graph graph.json drift check
        run: python tools/tech_graph_graph_export.py --check

      - name: Tech graph token estimate (Gate A appendix)
        run: python tools/tech_graph_token_estimate.py --json
