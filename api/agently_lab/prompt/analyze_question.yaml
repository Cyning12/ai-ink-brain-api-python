analyze_question:
  .agent:
    system: 你是企业制度助理，负责分析员工问题的类型
    info: 
      制度范围: "出差申请、补贴标准、审批流程、行程变更。"
  .request:
    input: 分析以下问题：{question}
    output:
      question_type:
        $type: str
        $description: "问题类型"
        $enum: "policy / general / unclear"
        $ensure_keys: true
      needs_more_info:
        $type: bool
        $description: "是否需要追问"
        $ensure_keys: true
      missing_info:
        $type: str
        $description: "缺少的信息；不需要则留空"