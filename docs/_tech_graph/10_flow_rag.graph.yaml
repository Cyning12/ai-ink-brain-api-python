graph_id: "10_flow_rag"
title: "RAG 子流程"
description: "RAG 召回、融合、回答与日志归档流程"
version: "2026-06-16"

nodes:
  - id: "IN"
    label: "入口 Query"
  - id: "HIS"
    label: "历史轮次"
  - id: "RW"
    label: "Query Rewrite"
  - id: "KQ"
    label: "keyword_query_text()"
  - id: "EMB"
    label: "async def embed"
  - id: "VEC"
    label: "Vector RPC"
  - id: "B1"
    label: "Structured Recall"
  - id: "FUSE"
    label: "fuse_hits_rrf()"
  - id: "HIT0"
    label: "hits == 0 ?"
  - id: "OUT_NO_DATA"
    label: "no_data / 不确定回答"
  - id: "CTX"
    label: "Context Build"
  - id: "LLM"
    label: "async def llm_answer"
  - id: "SRC"
    label: "sources payload"
  - id: "OUT"
    label: "返回 JSON / SSE"
  - id: "LOG"
    label: "async def save_debug_log"
  - id: "DB"
    label: "DB: rag_conversation_logs"
  - id: "ERR_AUTH"
    label: ">Auth Failed"
  - id: "EMB_FAIL"
    label: ">Embedding Failed"
  - id: "KEYWORD_ONLY"
    label: "keyword-only"
  - id: "TEND"
    label: "tool.call.end payload.keys"
  - id: "TEND_KEYS"
    label: "output.{vector_hits,structured_hits,keyword_hits_raw,keyword_hits_rewrite,hits,retry_count,embedding_error}<br/>error, latency_ms"

edges:
  - from: "IN"
    to: "AUTH"
    anchors:
      - path: "api/index.py"
        symbol: "_require_auth"
  - from: "AUTH"
    to: "HIS"
    mark: "[ok]"
  - from: "AUTH"
    to: "ERR_AUTH"
    mark: "[err]"
    anchors:
      - path: "api/index.py"
        symbol: "_require_auth"
  - from: "HIS"
    to: "RW"
    label: "可选"
    anchors:
      - path: "api/query_rewrite.py"
        symbol: "rewrite_query_with_history"
  - from: "HIS"
    to: "RW"
    label: "无历史"
  - from: "RW"
    to: "KQ"
    mark: "::branches"
    type: "branches"
  - from: "RW"
    to: "EMB"
    mark: "::branches"
    type: "branches"
    anchors:
      - path: "api/rag_recall_tools.py"
        symbol: "keyword_query_text_with_i18n_meta"
  - from: "KQ"
    to: "FTS"
  - from: "EMB"
    to: "VEC"
    mark: "~>"
    type: "async_calls"
    anchors:
      - path: "api/index.py"
        symbol: "fetch_keyword_hits"
      - path: "api/unified_chat.py"
        symbol: "rpc_execute_with_retry"
  - from: "EMB"
    to: "EMB_FAIL"
    mark: "[err]"
  - from: "EMB_FAIL"
    to: "KEYWORD_ONLY"
  - from: "FTS"
    to: "FTS"
    mark: "[retry=N]"
    anchors:
      - path: "api/rag_recall_tools.py"
        symbol: "rpc_execute_with_retry"
  - from: "VEC"
    to: "VEC"
    mark: "[retry=N]"
  - from: "FTS"
    to: "FUSE"
    mark: "::merges"
    type: "merges"
    anchors:
      - path: "api/hybrid_fusion.py"
  - from: "VEC"
    to: "FUSE"
    mark: "::merges"
    type: "merges"
  - from: "KEYWORD_ONLY"
    to: "FUSE"
    mark: "::merges"
    type: "merges"
  - from: "B1"
    to: "FUSE"
    mark: "[ok]"
  - from: "B1"
    to: "FUSE"
    mark: "[err]"
  - from: "IN"
    to: "B1"
    label: "date-like ?"
    type: "condition"
    anchors:
      - path: "api/rag_recall_tools.py"
        symbol: "structured_recall_by_date"
  - from: "FUSE"
    to: "HIT0"
    mark: "?>"
    type: "condition"
  - from: "HIT0"
    to: "OUT_NO_DATA"
    mark: "[yes]"
    anchors:
      - path: "api/unified_chat.py"
        line: 664
      - path: "api/index.py"
        line: 664
  - from: "HIT0"
    to: "CTX"
    mark: "[no]"
  - from: "OUT_NO_DATA"
    to: "CTX"
  - from: "FUSE"
    to: "CTX"
    anchors:
      - path: "api/unified_chat.py"
        symbol: "build_context"
  - from: "CTX"
    to: "LLM"
    anchors:
      - path: "api/unified_chat.py"
  - from: "LLM"
    to: "SRC"
    mark: "::yields"
    type: "yields"
    anchors:
      - path: "api/unified_chat.py"
        symbol: "_build_rag_sources_event"
      - path: "api/index.py"
        symbol: "build_sources_payload"
  - from: "SRC"
    to: "OUT"
  - from: "OUT"
    to: "LOG"
    mark: "::archives"
    type: "archives"
    anchors:
      - path: "api/database_manager.py"
  - from: "OUT"
    to: "OBS_DOC"
    label: "加载"
  - from: "LOG"
    to: "DB"
    mark: "~>"
    type: "async_calls"
  - from: "LOG"
    to: "RPC_DOC"
    label: "加载"
  - from: "FTS"
    to: "FTS_DOC"
    label: "加载"
  - from: "VEC"
    to: "RPC_DOC"
    label: "加载"
  - from: "TEND"
    to: "TEND_KEYS"
